# Configuration file for fMoW-Sentinel Classifier Training

# Dataset paths
root_dir: /home/michael/project_khthon/fmow
output_dir: ./large_objects

# Training parameters
batch_size: 8
epochs: 10
lr: 0.0001
num_workers: 1

# Model configuration
model_name: Sentinel2_SwinT_SI_RGB  # Foundation model name from satlaspretrain_models

# Data preprocessing
infill_nulls: false  # Infill null/black pixels
image_size: 224     # Target image size for resizing

# Category filtering
# Set to null to use all categories, or provide a list of category names
categories:
    - airport
    - airport_terminal
    - amusement_park
    - aquaculture
    - crop_field
    - dam
    - golf_course
    - impoverished_settlement
    - interchange
    - lighthouse
    - nuclear_powerplant
    - port
    - railway_bridge
    - road_bridge
    - runway
    - solar_farm
    - space_facility
    - stadium
    - tunnel_opening
    - wind_farm
